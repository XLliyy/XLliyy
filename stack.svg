<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 54" width="600" height="54">
  <defs>
    <linearGradient id="stackText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7A2" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#7AA2F7" />
    </linearGradient>
    <linearGradient id="stackLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7A2" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F7A2" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#7AA2F7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace;
    }
  </style>

  <text x="300" y="33" text-anchor="middle" class="mono" font-size="19" font-weight="700" letter-spacing="5" fill="url(#stackText)">
    <tspan fill="#00F7A2">[</tspan>  ⚔️  <tspan fill="#00F7A2">]</tspan>
  </text>

  <rect x="200" y="45" width="200" height="1.5" rx="0.75" fill="url(#stackLine)" />
</svg>
